# cx-capture.yml
# status: planned
#
# Registry of CX capture specs for a future weekly capture run. No workflow
# consumes this file yet — there is no `ghaw-cx-synthetic` (or `acw-*`)
# workflow in .github/workflows/. Per the paid RecordingStudio policy, CX
# captures must be *real product captures*, not synthetic fixtures; this
# registry will be wired up when that pipeline lands.
#
# Add an entry here for every `cx:required` feature so it is picked up once
# the weekly capture workflow exists.
#
# Format:
#   - slug: <feature-slug>          # matches RecordingStudio/capture-specs/<feature-slug>.yaml
#     description: <human label>    # short description shown in workflow summary
#     enabled: true                 # set to false to temporarily skip without deleting

# Example (uncomment and adapt when adding a real feature):
# features:
#   - slug: handoff-create
#     description: "Agent creates a new handoff and it reaches 'active' state"
#     enabled: true
#
#   - slug: cla-sign
#     description: "Contributor signs the CLA via PR comment"
#     enabled: true

features: []
