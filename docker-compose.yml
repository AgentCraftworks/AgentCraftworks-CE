version: "3.8"

services:
  # TypeScript service
  # Community Edition keeps all state in process memory — no database or cache is needed.
  typescript-api:
    build:
      context: ./typescript
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      GH_CE_APP_ID: ${GH_CE_APP_ID}
      GH_CE_APP_PRIVATE_KEY: ${GH_CE_APP_PRIVATE_KEY}
      GH_CE_WEBHOOK_SECRET: ${GH_CE_WEBHOOK_SECRET}
      NODE_ENV: development
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
