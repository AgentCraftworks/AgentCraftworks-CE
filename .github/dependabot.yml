# Dependabot configuration - keeps the root workspace lockfile patched.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
