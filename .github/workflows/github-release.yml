name: GitHub Release

# Engagement Level: T5 (Full Agent Team) — creates a GitHub Release from a version tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a signed tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          test "$(jq -r '.object.type' <<< "$ref")" = "tag" || {
            echo "::error::Release tags must be annotated and signed."
            exit 1
          }
          tag_sha=$(jq -r '.object.sha' <<< "$ref")
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          test "$verified" = "true" || {
            echo "::error::GitHub did not verify the release tag signature."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit on main."
            exit 1
          }
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and pack the TypeScript workspace
        run: |
          npm run build
          mkdir -p release-artifacts
          npm pack --workspace @agentcraftworks/core --pack-destination release-artifacts
        shell: bash

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: typescript
          format: spdx-json
          output-file: release-artifacts/agentcraftworks-ce-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_CE_APP_ID }}
          private-key: ${{ secrets.GH_CE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/*.tgz
            release-artifacts/*.spdx.json
          github-token: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
