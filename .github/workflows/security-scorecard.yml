# Engagement Level: T1 (Observer) - posture analysis only; no source changes.
name: Security Scorecard

on:
  push:
    branches: [main, staging]
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Analyze repository security posture
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
