name: TypeScript CI

# Agent engagement: T1 - read-only checks with contents:read permission.
on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w typescript run typecheck
      - run: npm -w typescript run build
      - run: npm -w typescript test
