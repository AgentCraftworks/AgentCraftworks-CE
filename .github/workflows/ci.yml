# Engagement Level: T1 (Observer) — build, test, and audit only; no writes.
name: TypeScript CI

# TypeScript CI — typecheck, build, test, and lint workflow files against ORG-STANDARD.

on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Check workflow ORG-STANDARD compliance
        run: node scripts/check-workflow-standards.mjs
      - run: npm -w typescript run typecheck
      - run: npm -w typescript run build
      - run: npm -w typescript test

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production workspace image
        run: docker build --file typescript/Dockerfile --tag ce-lockfile-test .
      - name: Check image health and authentication
        run: |
          container="$(docker run --detach --publish 127.0.0.1::3000 \
            --env GH_CE_API_TOKEN=ci-test-token ce-lockfile-test)"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          port="$(docker port "$container" 3000/tcp | cut -d: -f2)"
          base="http://127.0.0.1:$port"
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 "$base/health"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/handoffs")" = 401
          curl --fail --header 'Authorization: Bearer ci-test-token' "$base/api/handoffs"

  link-check:
    # Non-blocking for now (fail: false); offline mode validates only local file links and anchors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path node_modules
            --exclude-path typescript/node_modules
            --exclude-path typescript/dist
            --exclude-path dist
            --exclude-path docs/futures
            './**/*.md'
          fail: false
