# Engagement Level: T1 (Observer) — build, test, and audit only; no writes.
name: TypeScript CI

# TypeScript CI — typecheck, build, test, and lint workflow files against ORG-STANDARD.

on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Audit the standalone typescript/ lockfile — the one the Dockerfile ships with.
      # Run outside the workspace root so npm resolves typescript/package-lock.json, not the root lock.
      - name: Audit production dependencies (typescript/)
        run: |
          tmp="$(mktemp -d)"
          cp typescript/package.json typescript/package-lock.json "$tmp/"
          cd "$tmp"
          npm audit --omit=dev --audit-level=high
      - name: Check workflow ORG-STANDARD compliance
        run: node scripts/check-workflow-standards.mjs
      - run: npm -w typescript run typecheck
      - run: npm -w typescript run build
      - run: npm -w typescript test

  link-check:
    # Non-blocking for now (fail: false); offline mode validates only local file links and anchors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path node_modules
            --exclude-path typescript/node_modules
            --exclude-path typescript/dist
            --exclude-path dist
            --exclude-path docs/futures
            './**/*.md'
          fail: false
