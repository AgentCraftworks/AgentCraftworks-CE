# Engagement Level: T1 (Observer) - scan only; no source changes.
name: Security Gitleaks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan all fetched history without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config=.github/security/gitleaks.toml \
            --log-opts="--all" --redact=100 --exit-code=1 \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"
